name: Clone Starches Source

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  clone:
    name: Copy Original Starches Repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout new repository
        uses: actions/checkout@v4

      - name: Clone original Starches repository
        run: |
          git clone --depth 1 \
            https://github.com/Starchesssa/Starches-real-.git \
            source

      - name: Copy source files
        run: |
          cp -a source/. .
          rm -rf source .git

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit and push copied files
        run: |
          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Import original Starches project"
          fi

          git push origin HEAD:main
