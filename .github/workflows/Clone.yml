name: Clone Starches Source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clone:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout new repository
        uses: actions/checkout@v4

      - name: Clone original Starches repository
        run: |
          git clone https://github.com/Starchesssa/Starches-real-.git source

      - name: Copy source files
        run: |
          cp -a source/. .
          rm -rf source .git

      - name: Commit copied project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Import original Starches project"
          git push
