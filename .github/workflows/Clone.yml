name: Clone Starches Source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clone:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout new repository
        uses: actions/checkout@v4

      - name: Check public repository access
        run: |
          curl -fIL --max-time 20 \
            https://github.com/Starchesssa/Starches-real-.git

      - name: Clone original Starches repository
        run: |
          git -c credential.helper= clone \
            --depth 1 \
            https://github.com/Starchesssa/Starches-real-.git \
            source

      - name: Copy source files
        run: |
          cp -a source/. .
          rm -rf source .git

      - name: Commit copied project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Import original Starches project"
          fi

          git push origin HEAD
