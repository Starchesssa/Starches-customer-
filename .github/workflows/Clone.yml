name: Clone Starches Source

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  clone:
    name: Copy Original Starches Repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout destination repository
        uses: actions/checkout@v4
        with:
          path: destination

      - name: Checkout original Starches repository
        uses: actions/checkout@v4
        with:
          repository: Starchesssa/Starches-real-
          ref: main
          path: source
          persist-credentials: false

      - name: Copy source files
        run: |
          cp -a source/. destination/
          rm -rf destination/.git

      - name: Commit copied project
        working-directory: destination
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Import original Starches project"
          fi

          git push origin HEAD:main
